<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>השוואת עגלות סופר</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/></symbol>
        <symbol id="i-set" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    </svg>

    <button id="userSettingsBtn" title="הגדרות משתמש" aria-label="הגדרות משתמש"><svg class="ic"><use href="#i-set"/></svg></button>

    <div id="startView">
        <div class="hero s">
            <div class="top"><span class="brand"><svg class="ic"><use href="#i-cart"/></svg>השוואת עגלות</span></div>
            <div class="big" id="startHeadline"></div>
        </div>
        <div class="win start-card">
            <div id="loading" hidden>
                <canvas id="sphere" aria-hidden="true"></canvas>
                <div class="load-title">מביאים לך מחירים עדכניים מכל הרשתות</div>
                <div class="sub">זה ייקח כמה שניות</div>
            </div>
            <button id="compareBtn" class="cta">להשוות מחירים</button>
            <div id="status" role="status" aria-live="polite"></div>
            <div class="sub c" id="startNote">המחירים נבדקים עכשיו מול אתרי הרשתות</div>
            <label class="ai-switch"><input type="checkbox" id="aiToggle" role="switch"><span>חיפוש תחליפים עם AI</span></label>
            <div class="sub c" id="aiQuota" aria-live="polite"></div>
        </div>

        <div id="storePanel">
            <div class="panel-head"><span>משווים מול</span><button type="button" class="link-btn" id="settingsBtn">שינוי</button></div>
            <div class="chips">
                <label class="chip" style="--c:#e11d48"><input type="checkbox" id="toggleShufersal" checked><span>שופרסל</span></label>
                <label class="chip" style="--c:#2563eb"><input type="checkbox" id="toggleRamiLevy" checked><span>רמי לוי</span></label>
                <label class="chip" style="--c:#f97316"><input type="checkbox" id="toggleVictory" checked><span>ויקטורי</span></label>
                <label class="chip" style="--c:#7c3aed"><input type="checkbox" id="toggleMCK" checked><span>מחסני השוק</span></label>
            </div>
            <div class="chip-notes">
                <div class="store-note">שופרסל: <span id="noteShufersal">מחיר חי בזמן אמת</span></div>
                <div class="store-note">רמי לוי: <span id="noteRamiLevy">מחיר חי בזמן אמת</span></div>
                <div class="store-note">ויקטורי: <span id="noteVictory">מחיר חי בזמן אמת</span></div>
                <div class="store-note">מחסני השוק: <span id="noteMCK">מחיר חי בזמן אמת</span></div>
            </div>
        </div>
    </div>
    <div id="result" aria-live="polite"></div>
    <div class="foot">
        <button type="button" class="link-btn" id="historyLink">הסלים שלי</button>
        <button type="button" class="link-btn" id="feedbackLink">שליחת משוב</button>
    </div>

    <script src="supabase_config.js"></script>
    <script src="auth.js"></script>
    <script src="safe_html.js"></script>
    <script src="victory_match.js"></script>
    <script src="rami_guest.js"></script>
    <script src="results_view.js"></script>
    <script src="sphere.js"></script>
    <script src="popup.js"></script>
</body>
</html>
