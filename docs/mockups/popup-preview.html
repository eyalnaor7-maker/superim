function sample() {

    return { orderedStores: [...sortable, ...list.filter(s => !s.hasData)], sortable, itemCount: 23 };

const s = sample();
document.getElementById('f1').innerHTML = renderStoreSummary({ ...s, activeStore: 'shufersal' });
